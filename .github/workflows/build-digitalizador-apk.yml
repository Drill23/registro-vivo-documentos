name: Build Digitalizador APK
on:
  push:
    branches: [tmp-digitalizador-pdf-build]
    paths: ['android-scanner/**', '.github/workflows/build-digitalizador-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk DigitalizadorPDF.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DigitalizadorPDF-APK
          path: android-scanner/DigitalizadorPDF.apk
