<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#f7f4ef" />
    <meta name="description" content="Controle compartilhado de documentos, alteracoes e pendencias." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Registros de Documentos</title>
    <style>
      :root {
        background: #f7f4ef;
        color: #1d2a2e;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        touch-action: manipulation;
      }

      iframe {
        background: #f7f4ef;
        border: 0;
        height: 100dvh;
        inset: 0;
        position: fixed;
        width: 100vw;
      }

      .fallback {
        align-items: center;
        display: grid;
        gap: 14px;
        inset: 0;
        justify-items: center;
        padding: 24px;
        position: fixed;
        text-align: center;
      }

      .fallback a {
        align-items: center;
        background: #1d2a2e;
        border-radius: 8px;
        color: #fff;
        display: inline-flex;
        font-weight: 800;
        min-height: 44px;
        padding: 0 16px;
        text-decoration: none;
      }

      body.loaded .fallback {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="fallback" aria-hidden="true">
      <h1>Registros de Documentos</h1>
      <a href="https://script.google.com/macros/s/AKfycbxZ8jMJvwXox5bL_wjJC1TV-0j0UhXa_tmMs-VAkKov2V7RY18s9LBuLt67zlB8ErNgpQ/exec">Abrir aplicativo</a>
    </div>
    <iframe
      id="app-frame"
      title="Registros de Documentos"
      src="https://script.google.com/macros/s/AKfycbxZ8jMJvwXox5bL_wjJC1TV-0j0UhXa_tmMs-VAkKov2V7RY18s9LBuLt67zlB8ErNgpQ/exec"
      allow="clipboard-read; clipboard-write"
    ></iframe>
    <script>
      document.getElementById('app-frame').addEventListener('load', () => {
        document.body.classList.add('loaded');
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
      }
    </script>
  </body>
</html>
