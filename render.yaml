services:
  - type: web
    name: registro-vivo-documentos
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: APP_PASSWORD=admin node server/index.js
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: SHEETS_WEB_APP_URL
        sync: false
      - key: SHEETS_SECRET
        sync: false
